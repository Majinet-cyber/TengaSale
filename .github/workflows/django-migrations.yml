name: Django migration checks

on:
  pull_request:
  push:

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tenga_test
          POSTGRES_USER: tenga
          POSTGRES_PASSWORD: tenga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenga -d tenga_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tenga:tenga@localhost:5432/tenga_test
      SECRET_KEY: migration-check-only
      DEBUG: "False"

    defaults:
      run:
        working-directory: tengasale

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tengasale/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py check
