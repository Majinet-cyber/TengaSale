{# Skeleton card — use while loading a stat/KPI card #}
<div class="ts-skeleton ts-kpi-card" role="status" aria-busy="true" aria-label="Loading…">
  <div class="ts-skeleton__line ts-skeleton__line--short" style="height:28px;margin-bottom:10px;border-radius:6px;"></div>
  <div class="ts-skeleton__line ts-skeleton__line--medium" style="height:10px;"></div>
  <div class="ts-skeleton__line ts-skeleton__line--short" style="height:8px;width:55%;"></div>
</div>
