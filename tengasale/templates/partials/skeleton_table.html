{# Skeleton table — use while loading a data table #}
<div class="ts-skeleton" role="status" aria-busy="true" aria-label="Loading table…" style="padding:16px;">
  {% for i in "12345" %}
  <div class="ts-skeleton__row">
    <div class="ts-skeleton__cell"></div>
    <div class="ts-skeleton__cell"></div>
    <div class="ts-skeleton__cell" style="max-width:80px;"></div>
  </div>
  {% endfor %}
</div>
