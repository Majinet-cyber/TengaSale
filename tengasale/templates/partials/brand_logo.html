{% load static %}
{#
  brand_logo.html — reusable brand logo partial
  Usage:
    compact: {% include "partials/brand_logo.html" with variant="compact" %}
    full:    {% include "partials/brand_logo.html" with variant="full" %}
  Default is compact.
#}
{% if variant == "full" %}
<div class="logo-full-showcase">
  <img
    src="{% static 'images/TENGASALEe.png' %}"
    alt="TengaSale — Smartphone Financing for Malawi"
    class="logo-full-showcase__img"
    loading="lazy"
  >
</div>
{% else %}
<a href="{% url 'website_landing' %}" class="logo-compact" aria-label="TengaSale home">
  <img
    src="{% static 'images/TENGASALEe.png' %}"
    alt="TengaSale"
    class="logo-compact-img"
    width="38"
    height="38"
    onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex';"
  >
  <span class="logo-wordmark" style="display:none;" aria-hidden="true">
    <img src="{% static 'images/TENGASALEe.png' %}" alt="TengaSale" class="logo-wordmark-img">
  </span>
</a>
{% endif %}
