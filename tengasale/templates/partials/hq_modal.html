<div class="ts-modal" id="{{ modal_id }}" role="dialog" aria-modal="true" aria-labelledby="{{ modal_id }}-title" hidden data-testid="hq-modal">
  <div class="ts-modal__backdrop" data-modal-close></div>
  <div class="ts-modal__dialog">
    <div class="ts-modal__header">
      <h2 class="ts-modal__title" id="{{ modal_id }}-title">{{ title }}</h2>
      <button type="button" class="ts-modal__close" data-modal-close aria-label="Close">&times;</button>
    </div>
    <div class="ts-modal__body">
      {{ body }}
    </div>
    {% if footer %}
    <div class="ts-modal__footer">
      {{ footer }}
    </div>
    {% endif %}
  </div>
</div>
