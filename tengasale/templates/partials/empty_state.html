<div class="hq-empty-state ts-empty-state" style="padding:40px 24px;">
  <div class="hq-empty-state__icon" aria-hidden="true">
    {% if icon_svg %}
      {{ icon_svg|safe }}
    {% else %}
      <svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    {% endif %}
  </div>
  <h3 class="hq-empty-state__title">{{ title|default:"Nothing here yet" }}</h3>
  <p class="hq-empty-state__message">{{ message|default:"No records to display." }}</p>
  {% if action_url and action_label %}
  <div class="hq-empty-state__action">
    <a href="{{ action_url }}" class="ts-button-primary" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;">
      {{ action_label }}
    </a>
  </div>
  {% endif %}
</div>
