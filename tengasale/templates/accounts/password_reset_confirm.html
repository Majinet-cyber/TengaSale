{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Choose New Password | TengaSale</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="app-shell auth-shell">
    <div class="auth-brand">
        <img src="{% static 'images/Tenga.png' %}" alt="" class="logo-mark ts-logo-icon">
        <img src="{% static 'images/TENGASALEe.png' %}" alt="TengaSale" class="auth-wordmark-img ts-logo-auth">
        <p>Endless Possibilities</p>
    </div>

    <div class="auth-card">
        {% if validlink %}
            <form method="post">
                {% csrf_token %}
                {{ form.non_field_errors }}

                <label for="{{ form.new_password1.id_for_label }}">New password</label>
                {{ form.new_password1 }}

                <label for="{{ form.new_password2.id_for_label }}">Confirm new password</label>
                {{ form.new_password2 }}

                <button type="submit" class="primary-button">Update Password</button>
            </form>
        {% else %}
            <p class="auth-message">This reset link is no longer valid. Request a new link to continue.</p>
            <a href="{% url 'password_reset' %}" class="primary-button">Request New Link</a>
        {% endif %}
    </div>
</div>

</body>
</html>
