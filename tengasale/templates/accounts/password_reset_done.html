{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reset Link Sent | TengaSale</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="app-shell auth-shell">
    <div class="auth-brand">
        <img src="{% static 'images/Tenga.png' %}" alt="" class="logo-mark">
        <img src="{% static 'images/TENGASALEe.png' %}" alt="TengaSale" class="auth-wordmark-img">

</html>
