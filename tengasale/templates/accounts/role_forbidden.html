{% extends "base/base.html" %}

{% block content %}

<div class="role-forbidden-page">
    <div class="role-forbidden-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
        </svg>
    </div>
    <h1 class="role-forbidden-title">Area not available</h1>
    <p class="role-forbidden-desc">
        That area is not available for your role.
        {% if request.user.is_authenticated %}
        You are logged in as <strong>{{ request.user.username }}</strong>.
        {% endif %}
    </p>
    <a href="{{ dashboard_url }}" class="new-contract-cta" style="max-width:260px;margin:0 auto;">
        Go to my dashboard
    </a>
    <p style="margin-top:16px;font-size:13px;color:var(--muted);">
        Need help? <a href="{% url 'ticket_create' %}" style="color:var(--ts-orange);">Raise a support ticket</a>
    </p>
</div>

{% endblock %}
