{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Password Reset Successful — TengaSale</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ff5a00">
    <link rel="icon" type="image/png" href="{% static 'images/icon-192.png' %}" sizes="192x192">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/tengasale.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" crossorigin="anonymous">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; background: #eef2f6; }
        .auth-shell {
            min-height: 100dvh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 24px 16px calc(32px + env(safe-area-inset-bottom, 0px));
        }
        .auth-brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; gap: 10px; }
        .auth-brand img { max-width: 200px; max-height: 72px; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(255,90,0,0.18)); }
        .auth-brand p { font-size: 0.9rem; font-weight: 600; color: #64748b; letter-spacing: 0.05em; margin: 0; }
        .auth-card {
            width: 100%; max-width: 420px;
            background: #fff; border-radius: 20px;
            border: 1px solid #e4e7eb;
            box-shadow: 0 12px 32px rgba(17,17,17,0.10), 0 2px 8px rgba(17,17,17,0.04);
            padding: 36px 24px 28px;
            display: flex; flex-direction: column; align-items: center; gap: 16px;
            text-align: center;
        }
        .auth-success-icon {
            width: 64px; height: 64px; border-radius: 50%;
            background: linear-gradient(135deg, #16a34a, #22c55e);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(22,163,74,0.26);
            font-size: 28px; color: #fff;
        }
        .auth-card__title { font-size: 1.2rem; font-weight: 900; color: #0f172a; margin: 0; }
        .auth-card__body { font-size: 0.88rem; color: #64748b; margin: 0; line-height: 1.6; max-width: 300px; }
        .auth-submit {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            min-height: 52px; width: 100%; border: none; border-radius: 14px;
            background: #FF4D00; color: #fff; font-size: 1rem; font-weight: 800;
            cursor: pointer; text-decoration: none; transition: background 0.14s ease;
        }
        .auth-submit:hover { background: #d93f00; }
        .auth-footer { margin-top: 24px; font-size: 0.77rem; color: #94a3b8; text-align: center; }
    </style>
</head>
<body>

<div class="auth-shell">
    <div class="auth-brand">
        <img src="{% static 'images/TENGASALEe.png' %}" alt="TengaSale" onerror="this.style.display='none'">
        <p>{{ tenga_motto }}</p>
    </div>

    <div class="auth-card">
        <div class="auth-success-icon" aria-hidden="true">
            <i class="bi bi-check-lg"></i>
        </div>

        <h1 class="auth-card__title">Password reset successful</h1>

        <p class="auth-card__body">
            Your password has been updated. You can now sign in to TengaSale with your new password.
        </p>

        <a href="{% url 'login' %}" class="auth-submit">
            <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
            Sign In Now
        </a>
    </div>

    <p class="auth-footer">v1.0.0 &nbsp;·&nbsp; &copy; TengaSale 2025</p>
</div>

</body>
</html>
