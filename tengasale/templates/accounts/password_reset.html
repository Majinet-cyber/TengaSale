{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reset Password | TengaSale</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="app-shell auth-shell">
    <div class="auth-brand">
        <img src="{% static 'images/Tenga.png' %}" alt="" class="logo-mark">
        <img src="{% static 'images/TENGASALEe.png' %}" alt="TengaSale" class="auth-wordmark-img">
        <p>Endless Possibilities</p>
    </div>

    <form method="post" class="auth-card">
        {% csrf_token %}
        <p class="auth-message">Enter your email address and we will send a secure password reset link.</p>
        {{ form.non_field_errors }}

        <label for="{{ form.email.id_for_label }}">Email address</label>
        {{ form.email }}

        <button type="submit" class="primary-button">Send Reset Link</button>
        <a href="{% url 'login' %}" class="auth-link">Back to sign in</a>
    </form>
</div>

</body>
</html>
