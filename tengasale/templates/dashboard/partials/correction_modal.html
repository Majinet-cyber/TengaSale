<div class="correction-modal" data-correction-modal hidden>
    <div class="correction-modal__backdrop" data-correction-close></div>
    <form class="correction-panel" data-correction-form data-correction-url="{% url 'underwriter_correction_action' app.id %}">
        {% csrf_token %}
        <input type="hidden" name="field_name" data-correction-field>
        <input type="hidden" name="label" data-correction-label-input>
        <input type="hidden" name="section" data-correction-section>
        <input type="hidden" name="action" value="mark" data-correction-action>

        <h2 data-correction-title>Mark field for correction</h2>
        <p>Field: <strong data-correction-label></strong></p>
        <label for="correction-note">What should the merchant fix?</label>
        <textarea id="correction-note" name="note" rows="4" data-correction-note></textarea>

        <div class="correction-panel__actions">
            <button type="button" class="btn btn-outline" data-correction-close>Cancel</button>
            <button type="button" class="btn btn-danger-soft" data-correction-remove hidden>Remove correction</button>
            <button type="submit" class="btn" data-correction-submit>MARK FOR EDIT</button>
        </div>
    </form>
</div>
