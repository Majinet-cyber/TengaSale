{% extends "base/base.html" %}

{% block page_title %}IMEI Entry{% endblock %}

{% block content %}

<a href="{% url 'contract_signature' contract.id %}" class="soft-back">
    <span class="soft-back-icon">&larr;</span>
    <span>Back</span>
</a>

<h1 class="greeting">Phone IMEI</h1>

<form method="post" class="card">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="form-group">
        <label for="{{ form.imei_number.id_for_label }}">Phone IMEI *</label>
        {{ form.imei_number }}
        {{ form.imei_number.errors }}
        <p class="field-help">Enter exactly 15 digits.</p>
    </div>
    <button type="submit" class="btn primary-button">Next</button>
</form>

<script>
    (function () {
        const input = document.querySelector("[data-imei-input]");
        if (!input) return;
        input.addEventListener("input", function () {
            input.value = input.value.replace(/\D/g, "").slice(0, 15);
        });
    })();
</script>

{% endblock %}
