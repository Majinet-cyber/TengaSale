{% load static %}
<header class="topbar hq-topbar">
  <div class="hq-topbar-left">
    <a href="{% url 'support_dashboard' %}" class="hq-brand-link" aria-label="Tech Support Home">
      <img src="{% static 'images/Tenga.png' %}" alt="" class="hq-brand-logo ts-logo-icon" aria-hidden="true">
      <span class="hq-brand-text">
        <img src="{% static 'images/TENGASALEe.png' %}" alt="TengaSale" class="hq-brand-wordmark ts-logo-wordmark">
        <span class="hq-brand-sub">Tech Support</span>
      </span>
    </a>
  </div>
  <div class="hq-topbar-right">
    <a href="{% url 'ticket_create' %}" class="hq-topbar-btn hq-topbar-btn--primary">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span class="btn-label">New Ticket</span>
    </a>
    <a href="{% url 'bug_monitor' %}" class="hq-topbar-btn"><span class="btn-label">Bugs</span></a>
    <a href="{% url 'ticket_list' %}" class="hq-topbar-btn"><span class="btn-label">Tickets</span></a>
    <a href="{% url 'conversation_list' %}" class="hq-topbar-btn" title="WhatsApp Conversations">
      <span class="btn-label">WhatsApp</span>
    </a>
    {% if is_hq_user %}
    <a href="{% url 'hq_dashboard' %}" class="hq-topbar-btn"><span class="btn-label">HQ</span></a>
    {% endif %}
    <span class="hq-country-pill" title="Operating country: Malawi">
      {% include "portal/_malawi_flag.html" %}
      Malawi
    </span>
    <form method="post" action="{% url 'logout' %}" style="margin:0">
      {% csrf_token %}
      <button type="submit" class="hq-icon-btn hq-icon-btn--danger" title="Sign out" aria-label="Sign out">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </form>
  </div>
</header>
