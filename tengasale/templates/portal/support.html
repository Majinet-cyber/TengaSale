{% extends "base/base.html" %}

{% block page_title %}Support | TengaSale{% endblock %}

{% block content %}
<div class="page-back-row">
  <a href="{% url 'portal_search' %}" class="back-link">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Back
  </a>
  <span class="page-label">Support</span>
</div>

<div class="glass-card portal-support-card">
  <div class="portal-support-card__title">Need Help?</div>
  <p class="portal-support-card__desc">
    For payment help, contract questions, or account support, contact TengaSale Support.
  </p>

  <a href="{{ tengasale_whatsapp_link|default:'#' }}"
     target="_blank" rel="noopener"
     class="portal-support-link portal-support-link--whatsapp">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#168a45" stroke="none" aria-hidden="true">
      <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.33 4.96L2.05 22l5.25-1.38a9.93 9.93 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91A9.86 9.86 0 0 0 19.05 4.9 9.85 9.85 0 0 0 12.04 2Z"/>
    </svg>
    WhatsApp Support
  </a>

  <a href="{% url 'website_contact' %}?category=payment_help#support" class="portal-support-link">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.61 1h3a2 2 0 0 1 2 1.72 12.08 12.08 0 0 0 .65 2.65 2 2 0 0 1-.45 2.11L7.77 8.5a16 16 0 0 0 6.18 6.18l1.02-1.03a2 2 0 0 1 2.11-.45 12.08 12.08 0 0 0 2.65.65A2 2 0 0 1 22 16.92Z"/>
    </svg>
    Payment Help Form
  </a>

  <a href="mailto:{{ tenga_support_email }}" class="portal-support-link">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
      <polyline points="22,6 12,13 2,6"/>
    </svg>
    Email Support
  </a>
</div>
{% endblock %}
