<div class="cpd-rows">
  {% for row in rows %}
    <div class="cpd-rows__row">
      <span class="cpd-rows__label">
        {{ row.label }}
      </span>

      <span class="cpd-rows__value{% if row.tone %} cpd-rows__value--{{ row.tone }}{% endif %}{% if row.mono %} cpd-rows__value--mono{% endif %}">
        {{ row.value }}
      </span>
    </div>
  {% endfor %}
</div>
