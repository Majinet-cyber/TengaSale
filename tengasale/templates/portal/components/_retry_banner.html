{% load ts_filters %}

<div class="cpd-retry">
  <div class="cpd-retry__title">
    {{ retry_title|default:"Start a fresh attempt" }}
  </div>

  <div class="cpd-retry__desc">
    {{ retry_desc }}
  </div>

  <form
    class="cpd-retry__form"
    method="post"
    action="{{ retry_action_url }}"
    data-retry-payment
  >
    {% csrf_token %}

    {% for field in retry_fields %}
      <input type="hidden" name="{{ field.name }}" value="{{ field.value }}">
    {% endfor %}

    <button
      type="submit"
      class="cpd-actionbar__btn cpd-actionbar__btn--primary"
      data-retry-button
    >
      {% ts_icon "refresh" %}
      {{ retry_button_label|default:"Retry this payment" }}
    </button>
  </form>
</div>
