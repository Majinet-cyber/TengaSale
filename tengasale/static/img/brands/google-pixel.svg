<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="none"/>
  <!-- Google Pixel minimalist phone with color bar -->
  <rect x="25" y="10" width="50" height="80" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <rect x="28" y="15" width="44" height="65" rx="2" fill="#4b5563"/>
  <!-- Google color bar accent -->
  <rect x="28" y="75" width="44" height="5" fill="url(#googleGrad)"/>
  <defs>
    <linearGradient id="googleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#34A853;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#FBBC05;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA4335;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Camera bump -->
  <rect x="60" y="18" width="12" height="12" rx="3" fill="#10b981"/>
</svg>

